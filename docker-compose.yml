services:
  indexer:
    build:
      context: apps/indexer
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=development
      - BASE_SEPOLIA_RPC=https://sepolia.base.org
      - HOOK_ADDRESS=0xBCC9e1C474Ed195b3791f2c41EdAC2a25c5b80c0
      - ARC_RPC_URL=https://rpc.testnet.arc.network
      - SIMULATION_REGISTRY_ADDRESS=0xd501D47b246438A18C8a0BFFCF10338CfBB661a2
      - ARKIV_RPC_URL=https://rpc.rabdi.db-chain.testnet.arkiv.network
      - ARKIV_ACCESS_KEY=local_evaluator_memory_key
      - ARKIV_DEV_MODE=memory
      - DEMO_FAST=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
